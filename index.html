<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1013">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Личный помощник курьера в Дрездене: карта с маршрутом по велодорожкам, заметки по адресам, немецкие фразы, чек-лист, ПДД.">
  <meta name="referrer" content="no-referrer">
  <title>Flink Helper</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Тема до загрузки страницы — чтобы не мигало тёмным при светлой теме.
    try { if (JSON.parse(localStorage.getItem('theme')) === 'light') document.documentElement.dataset.theme = 'light'; } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <h1 id="title">Flink Helper</h1>
    <button id="theme-btn" class="btn btn-ghost topbar-btn theme-btn" aria-label="Светлая тема">☀️</button>
    <button id="settings-btn"
 class="btn btn-ghost topbar-btn" aria-label="Данные и настройки">⚙️</button>
  </header>

  <main id="main"></main>

  <nav id="nav" class="bottom-nav" aria-label="Разделы"></nav>

  <section id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <header class="topbar">
      <button id="sheet-close" class="btn btn-ghost topbar-btn" aria-label="Назад">← Назад</button>
      <h1 id="sheet-title" class="sheet-title"></h1>
    </header>
    <div id="sheet-body" class="sheet-body"></div>
  </section>

  <div id="fullscreen" class="fullscreen" hidden role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript>Для работы нужен JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
